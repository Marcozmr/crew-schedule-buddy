# SPIKE (descartável): gera um .ipa SEM assinatura para instalar no iPhone pelo Sideloadly
# (Windows) com um Apple ID gratuito. O app instalado assim para de abrir após 7 dias.
#
# Precisa do secret VITE_ENV_FILE: as linhas VITE_* do .env local (valores públicos do app web).
# Roda sozinho a cada push na branch do spike, ou manualmente em Actions → "iOS teste".
name: iOS teste (sem assinatura)

on:
  push:
    branches: [spike/webview-iflight]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Variáveis do app web
        env:
          VITE_ENV_FILE: ${{ secrets.VITE_ENV_FILE }}
        run: |
          if [ -z "$VITE_ENV_FILE" ]; then echo "Falta o secret VITE_ENV_FILE"; exit 1; fi
          printf '%s\n' "$VITE_ENV_FILE" > .env.production.local

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Compilar para iPhone sem assinatura
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -qry EscalaX-teste.ipa Payload
          ls -lh EscalaX-teste.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: EscalaX-teste-ipa
          path: EscalaX-teste.ipa
          retention-days: 14
