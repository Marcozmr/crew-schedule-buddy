# Projeto Supabase do EscalaX — DEVE coincidir com VITE_SUPABASE_URL do frontend
# Migrado para projeto controlado (fbryqzwykdhnmskfectg)
# Deploy: npm run deploy:flight-status ou npm run deploy:functions
project_id = "fbryqzwykdhnmskfectg"

# Produção (Dashboard → Authentication → URL Configuration) — NÃO deixar localhost:
#   Site URL: https://www.escalax.app.br
#   Redirect URLs: https://www.escalax.app.br/**, https://escalax.app.br/**,
#                  http://localhost:5173/**, http://127.0.0.1:5173/**
# Frontend produção: VITE_APP_URL=https://www.escalax.app.br (Vercel)

# Validação JWT no handler (getUser) — evita 401 no gateway antes do worker e respostas opacas no cliente.
[functions.send-support-email]
verify_jwt = false

# Login/signup não têm JWT de utilizador; validação apenas com anon key + rate limit no worker.
[functions.auth-rate-limit]
verify_jwt = false

# Chamada com header secreto (sem JWT de utilizador).
[functions.keep-alive]
verify_jwt = false

[functions.flight-search]
verify_jwt = false